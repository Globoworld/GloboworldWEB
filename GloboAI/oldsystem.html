<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GloboAI</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>

    <link rel="icon" href="favicon.ico"> 

<style>
    :root {
        --bg-dark: #1e1e1e;
        --bg-light: #252526;
        --sidebar-bg: #2d2d30;
        --text-color: #d4d4d4;
        --accent-color: #007acc;
        --user-bubble: #007acc;
        --bot-bubble: #3c3c3c;
        --border-color: #3f3f46;
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Base Font Size e Altezza 100% */
    html {
        font-size: 62.5%; 
        height: 100%; 
    }

    /* Stile generale e reset */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        height: 100%; 
        overflow: hidden;
        font-family: var(--font-family);
        background-color: var(--bg-dark);
        color: var(--text-color);
        font-size: 1.6rem;
    }
    
    .container {
        height: 100%;
        display: flex;
        flex-wrap: nowrap;
        overflow: hidden;
    }

    /* ASIDE (Sidebar) - non modificato */
    .chat__menu {
        width: 100%;
        max-width: 25rem; 
        background-color: var(--sidebar-bg);
        padding: 1.5rem; 
        display: flex;
        flex-direction: column;
        border-right: 0.1rem solid var(--border-color);
        transition: transform 0.3s ease-in-out;
        z-index: 10;
        flex-shrink: 0; 
    }

    .logo {
        text-align: center;
        margin-bottom: 2rem;
    }

    .logo img {
        max-width: 100%;
        height: auto;
        border-radius: 0.8rem;
    }

    #new-chat-btn, #delete-chat-btn {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 0.5rem;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: bold;
        font-size: 1.4rem; 
        transition: background-color 0.2s;
    }

    #new-chat-btn {
        background-color: var(--accent-color);
        color: white;
    }

    #new-chat-btn:hover {
        background-color: #005f99;
    }

    #delete-chat-btn {
        background-color: #cc4444;
        color: white;
    }

    #delete-chat-btn:hover {
        background-color: #a33232;
    }

    #chat-list {
        width: 100%;
        padding: 0.8rem;
        border-radius: 0.5rem;
        border: 0.1rem solid var(--border-color);
        background-color: var(--bg-dark);
        color: var(--text-color);
        margin-top: 0.5rem;
        cursor: pointer;
        flex-grow: 0;
        font-size: 1.4rem; 
    }

    @media (max-width: 768px) {
        .chat__menu {
            position: absolute;
            height: 100%;
            left: 0;
            top: 0;
            transform: translateX(-100%);
        }
        .chat__menu.open {
            transform: translateX(0);
        }
    }

    /* BODY (Chat principale) */
    .chat__body {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-light);
        overflow: hidden;
    }

    /* HEADER - non modificato */
    .chat__header {
        padding: 1rem 1.25rem;
        background-color: var(--sidebar-bg);
        border-bottom: 0.1rem solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0; 
    }

    .chat__header h1 {
        font-size: 2.2rem; 
        color: var(--accent-color);
        margin-bottom: 0.25rem;
    }

    .chat__header p {
        font-size: 1.2rem; 
        color: #888;
    }

    .menu-toggle {
        display: none;
        background: none;
        border: none;
        color: var(--text-color);
        font-size: 2rem; 
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .menu-toggle {
            display: block;
        }
    }

    /* MAIN (Area Messaggi e Footer) */
    .chat__main {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        /* CORREZIONE: Rimuovi padding per non creare spazio sotto */
        padding: 0; 
        overflow: hidden;
    }

    #chat-box {
        flex-grow: 1; 
        overflow-y: auto;
        /* Aggiungiamo qui il padding per lo scorrimento e i lati */
        padding: 1.5rem; 
        margin-bottom: 0; 
    }
    
    /* CORREZIONE FINALE: Forza il padding sull'ultimo elemento visibile */
    #chat-box .message:last-child {
        margin-bottom: 1.5rem; /* Spazio tra l'ultimo messaggio e il footer */
    }


    /* Stile delle bolle di messaggio - non modificato */
    .message {
        max-width: 75%;
        padding: 1.2rem 1.5rem;
        margin-bottom: 1rem;
        border-radius: 2rem;
        line-height: 1.5;
        word-wrap: break-word;
        font-size: 1.6rem; 
    }

    .user {
        background-color: var(--user-bubble);
        color: white;
        align-self: flex-end;
        margin-left: auto;
        border-bottom-right-radius: 0.5rem;
    }

    .bot {
        background-color: var(--bot-bubble);
        color: var(--text-color);
        align-self: flex-start;
        margin-right: auto;
        border-bottom-left-radius: 0.5rem;
    }
    
    /* ... (Omessi stili per link, tabelle, code block - rimangono invariati) */


    /* FOOTER */
    .chat__footer {
        display: flex;
        align-items: flex-end; 
        border-top: 0.1rem solid var(--border-color);
        /* CORREZIONE: Lo spazio è solo padding */
        padding: 1.5rem;
        flex-shrink: 0; 
    }

    .chat__textarea {
        flex-grow: 1;
        min-height: 4.8rem; 
        max-height: 15rem; 
        padding: 1.1rem 1.6rem; 
        border: 0.1rem solid var(--border-color);
        border-radius: 2.5rem; 
        margin-right: 1rem;
        resize: vertical; 
        background-color: var(--bg-dark);
        color: var(--text-color);
        font-size: 1.6rem; 
        line-height: 1.3;
        overflow-y: auto;
        transition: border-color 0.2s;
    }

    .chat__textarea:focus {
        outline: none;
        border-color: var(--accent-color);
    }

    .chat-submit {
        height: 4.8rem; 
        width: 4.8rem; 
        padding: 0; 
        border: none;
        border-radius: 50%;
        background-color: var(--accent-color);
        color: white;
        cursor: pointer;
        transition: background-color 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0; 
        font-size: 2rem; 
    }

    .chat-submit:hover {
        background-color: #005f99;
    }

    /* Pulsante per il file */
    #file-input {
        display: none;
    }
    
    .send-file {
        height: 4.8rem; 
        width: 4.8rem;
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--accent-color);
        font-size: 2.4rem; 
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        margin-right: 1rem;
    }

    .send-file:hover {
        color: #005f99;
    }

    /* Responsività generale - non modificato */
    @media (max-width: 768px) {
        .chat__body {
            flex-direction: column;
        }
        .chat__footer {
            justify-content: space-between;
        }
    }
    
    /* Stili per i blocchi di codice (ricopiati qui per completezza del codice) */
    .code-block-wrapper {
        position: relative;
        margin: 1rem 0;
    }

    .code-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #1a1a1a;
        padding: 0.5rem 1rem;
        border-top-left-radius: 0.8rem;
        border-top-right-radius: 0.8rem;
        font-size: 1.2rem; 
        color: #aaa;
    }

    .copy-code-btn {
        background: #4a4a4a;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
        font-size: 1.2rem;
    }

    .copy-code-btn:hover {
        background: #5a5a5a;
    }

    .message pre {
        margin: 0 !important;
        border-top-left-radius: 0;
        border-top-right-radius: 0;
    }
    /* Fine stili per i blocchi di codice */
</style>
</head>
<body>

    <div class="container">
        <aside class="chat__menu" id="menu">
            <div class="logo">
                <img src="logo-placeholder.png" alt="GloboAI Logo"> 
            </div>
            <button id="new-chat-btn"><i class="fas fa-plus-circle"></i> Nuova Chat</button>
            <button id="delete-chat-btn"><i class="fas fa-trash-alt"></i> Elimina Chat</button>
            <select id="chat-list" aria-label="Seleziona chat precedente">
                <option value="default">Chat precedenti...</option>
            </select>
        </aside>

        <main class="chat__body">
            <header class="chat__header">
                <div>
                    <h1>GloboAI</h1>
                    <p>La tua intelligenza artificiale per l'analisi del codice.</p>
                </div>
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
            </header>

            <section class="chat__main">
                <div id="chat-box">
                    </div>
                
                <footer class="chat__footer">
                    <input type="file" id="file-input" accept=".txt, .js, .css, .html, .py, .java, .c, .cpp, .php">
                    <label for="file-input" class="send-file" title="Allega File">
                        <i class="fas fa-paperclip"></i>
                    </label>
                    <textarea id="user-input" class="chat__textarea" placeholder="Scrivi il tuo messaggio o incolla il codice qui..." rows="1"></textarea>
                    <button id="send-btn" class="chat-submit" title="Invia Messaggio">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </footer>
            </section>
        </main>
    </div>

<script>
const API_URL = 'https://free.v36.cm/v1/chat/completions';
const API_KEY = 'sk-uw0qBhVuhLAUFDbQBb955989A13c463cA765A26aE1035e41';

document.addEventListener('DOMContentLoaded', () => {
    // 1. Definizione corretta delle variabili
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const newChatBtn = document.getElementById('new-chat-btn');
    const deleteChatBtn = document.getElementById('delete-chat-btn');
    const chatList = document.getElementById('chat-list');
    const menu = document.getElementById('menu');
    const menuToggle = document.getElementById('menu-toggle');
    const fileInput = document.getElementById('file-input');

    let currentChatId;

    // 🔹 Scroll sempre in fondo
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 💡 Mostra messaggio con supporto Markdown/HTML
    function appendMessage(text, who) {
        const div = document.createElement('div');
        div.className = 'message ' + (who === 'user' ? 'user' : 'bot');

        if (who === 'bot') {
            const sanitizedText = text.replace(/‘’’’\s*(\w+)?\n([\s\S]+?)\n‘’’’/g, '```$1\n$2\n```');
            const rawHtml = marked.parse(sanitizedText);
            div.innerHTML = DOMPurify.sanitize(rawHtml);

            div.querySelectorAll('pre > code').forEach(codeElement => {
                const preElement = codeElement.parentElement;
                const language = (codeElement.className.match(/language-(\w+)/) || [, ''])[1];
                const header = document.createElement('div');
                header.className = 'code-block-header';
                const langSpan = document.createElement('span');
                langSpan.textContent = language;
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-code-btn';
                copyBtn.textContent = 'Copia';
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(codeElement.textContent).then(() => {
                        copyBtn.textContent = 'Copiato!';
                        setTimeout(() => { copyBtn.textContent = 'Copia'; }, 2000);
                    })
                });
                
                header.appendChild(langSpan);
                header.appendChild(copyBtn);
                const wrapper = document.createElement('div');
                wrapper.className = 'code-block-wrapper';
                preElement.parentNode.insertBefore(wrapper, preElement);
                wrapper.appendChild(header);
                wrapper.appendChild(preElement);
            });
            
            div.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
            
        } else {
            div.textContent = text;
        }

        chatBox.appendChild(div);
        scrollToBottom();
        return div;
    }

    function showApiError(errorResponse) {
        const errorMsg = document.createElement("div");
        errorMsg.className = "message bot error";
        errorMsg.innerHTML = `
        ⚠️ Si è verificato un errore durante la chiamata API.<br>
        <button class="reload-btn">Ricarica la pagina</button>
        <button class="debug-btn">Più dettagli</button>
        <pre class="debug-output" style="display:none; max-height:200px; overflow:auto; background:#111; color:#0fa; padding:5px; border-radius:5px; margin-top:5px;"></pre>
        `;
        chatBox.appendChild(errorMsg);
        scrollToBottom();

        errorMsg.querySelector(".reload-btn").addEventListener("click", () => {
            location.reload();
        });

        const debugBtn = errorMsg.querySelector(".debug-btn");
        const debugOutput = errorMsg.querySelector(".debug-output");
        debugBtn.addEventListener("click", () => {
            if (debugOutput.style.display === "none") {
                debugOutput.style.display = "block";
                try {
                    debugOutput.textContent =
                        typeof errorResponse === "object" && errorResponse !== null
                            ? JSON.stringify(errorResponse, null, 2)
                            : String(errorResponse);
                } catch (e) {
                    debugOutput.textContent = String(errorResponse);
                }
                debugBtn.textContent = "Nascondi dettagli";
            } else {
                debugOutput.style.display = "none";
                debugBtn.textContent = "Più dettagli";
            }
        });
    }

    function loadChats() {
        const chats = JSON.parse(localStorage.getItem('chats')) || [];
        chatList.innerHTML = '<option value="">Seleziona una chat</option>';
        chats.forEach(chat => {
            const opt = document.createElement('option');
            opt.value = chat.id;
            opt.textContent = chat.title || "Nuova chat";
            chatList.appendChild(opt);
        });
        const cur = localStorage.getItem('currentChatId') || '';
        if (cur) chatList.value = cur;
    }

    function createNewChat() {
        const systemMessage = {
            role: "system",
            content: "Sei GloboAI, un Assistente AI creato da Globoworld. Il tuo compito è servire le richieste dell'utente in modo etico e responsabile, purché non siano illegali."
        };
        let chats = JSON.parse(localStorage.getItem('chats')) || [];
        const newChat = { id: Date.now().toString(), title: "Nuova chat", messages: [systemMessage] };
        chats.unshift(newChat);
        localStorage.setItem('chats', JSON.stringify(chats));
        localStorage.setItem('currentChatId', newChat.id);
        return newChat.id;
    }

    function updateChatTitle(chatId, newTitle) {
        const chats = JSON.parse(localStorage.getItem('chats')) || [];
        const chat = chats.find(c => c.id === chatId);
        if (chat) {
            chat.title = newTitle;
            localStorage.setItem('chats', JSON.stringify(chats));
            loadChats();
        }
    }

    function deleteChat(chatId) {
        let chats = JSON.parse(localStorage.getItem('chats')) || [];
        chats = chats.filter(c => c.id !== chatId);
        localStorage.setItem('chats', JSON.stringify(chats));
        
        let nextChatId = null;
        if (chats.length) {
            // Seleziona la prima chat rimasta come corrente
            nextChatId = chats[0].id;
            localStorage.setItem('currentChatId', nextChatId);
        } else {
            // Se non ci sono più chat, rimuovi l'ID corrente
            localStorage.removeItem('currentChatId');
        }
        
        // Ritorna l'ID della prossima chat
        return nextChatId;
    }

    function loadChatMessages(chatId) {
        const chats = JSON.parse(localStorage.getItem('chats')) || [];
        const chat = chats.find(c => c.id === chatId);
        return chat ? chat.messages : [];
    }

    function saveMessage(chatId, message) {
        const chats = JSON.parse(localStorage.getItem('chats')) || [];
        const chat = chats.find(c => c.id === chatId);
        if (chat) {
            chat.messages.push(message);
            localStorage.setItem('chats', JSON.stringify(chats));
        }
    }

    function displayChat(chatId) {
        chatBox.innerHTML = '';
        const msgs = loadChatMessages(chatId);
        // Filtra il system message prima di visualizzare
        msgs.filter(m => m.role !== 'system').forEach(m => {
            appendMessage(m.content, m.role === 'user' ? 'user' : 'bot');
        });
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text && !fileInput.files.length) return;

        // Gestisci il messaggio dell'utente
        if (text) {
            appendMessage(text, 'user');
            saveMessage(currentChatId, { role: 'user', content: text });
            userInput.value = '';
        }

        // 💡 Gestione file (anche se disattivata)
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            appendMessage(`Funzione di caricamento file (**${file.name}**) attualmente in fase di sviluppo, considera una donazione: <a href="https://paypal.me/PayPalOfficialBot" target="_blank">Dona Ora</a>`, 'user');
            saveMessage(currentChatId, { role: 'user', content: `File: ${file.name}` });
            fileInput.value = ''; // Resetta l'input file
            return; 
        }
        
        // Se invii solo testo, prosegui con l'API
        const typingNode = appendMessage('Sto scrivendo...', 'bot');

        const requestBody = {
            model: 'gpt-4o-mini',
            messages: loadChatMessages(currentChatId)
        };
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify(requestBody)
            });
            if (typingNode && typingNode.parentNode) typingNode.parentNode.removeChild(typingNode);
            if (!res.ok) {
                let errorDetails = { status: res.status, statusText: res.statusText };
                try {
                    const errorJson = await res.json();
                    errorDetails = { ...errorDetails, ...errorJson };
                } catch (e) { /* Ignora */ }
                throw errorDetails;
            }

            const data = await res.json();
            let botText = data.choices?.[0]?.message?.content || "Ricarica la pagina e riprova.";
            appendMessage(botText, 'bot');
            saveMessage(currentChatId, { role: 'assistant', content: botText });
            const chats = JSON.parse(localStorage.getItem('chats')) || [];
            const chat = chats.find(c => c.id === currentChatId);
            if (chat && chat.title === "Nuova chat") {
                try {
                    const titleReq = {
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: "system", content: "Genera un titolo breve (massimo 3 parole) per questa chat. Basalo sull'ultimo messaggio dell'utente." },
                            ...chat.messages.filter(m => m.role !== 'system').slice(-1)
                        ]
                    };
                    const titleRes = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${API_KEY}`
                        },
                        body: JSON.stringify(titleReq)
                    });
                    if (titleRes.ok) {
                        const titleData = await titleRes.json();
                        const newTitle = titleData.choices?.[0]?.message?.content?.trim() || "Nuova chat";
                        updateChatTitle(currentChatId, newTitle);
                    } else {
                        console.warn("Fallita la generazione del titolo (status:", titleRes.status, ")");
                    }
                } catch (titleErr) {
                    console.error("Errore generazione titolo:", titleErr);
                }
            }
        } catch (err) {
            console.error("Errore fatale API/Network:", err);
            if (typingNode && typingNode.parentNode) typingNode.parentNode.removeChild(typingNode);
            showApiError(err);
        }
    }

    // ----------------------------------------------------
    // 2. Riorganizzazione e attivazione corretta degli Eventi UI
    // ----------------------------------------------------

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            sendMessage();
        }
    });

    menuToggle.addEventListener('click', () => {
        menu.classList.toggle('open');
    });

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ⭐ GESTIONE NUOVA CHAT: crea e ricarica (per resettare l'UI)
    newChatBtn.addEventListener('click', () => {
        createNewChat();
        location.reload(); 
    });

    // ⭐ GESTIONE ELIMINA CHAT: elimina e ricarica (per resettare l'UI)
    deleteChatBtn.addEventListener('click', () => {
        if (window.confirm("Sei sicuro di voler eliminare questa chat?")) {
            const nextId = deleteChat(currentChatId);
            if (!nextId) {
                // Se non c'è più nulla, crea una nuova chat vuota
                createNewChat();
            }
            location.reload(); 
        }
    });

    chatList.addEventListener('change', (e) => {
        const id = e.target.value;
        if (id) {
            currentChatId = id;
            localStorage.setItem('currentChatId', id);
            displayChat(id);
        }
    });

    // 🔹 Avvio (gestione della persistenza)
    loadChats();
    currentChatId = localStorage.getItem('currentChatId');
    const existingChats = JSON.parse(localStorage.getItem('chats')) || [];

    // ⭐ Verifica se l'ID corrente è valido e se la chat esiste
    const chatExists = currentChatId && existingChats.some(c => c.id === currentChatId);

    if (!chatExists) {
        // Se non esiste, crea una nuova chat e la imposta come corrente
        currentChatId = createNewChat();
        // Ricarica la lista per assicurarsi che la nuova chat sia selezionata nel dropdown
        loadChats(); 
    }

    // Mostra la chat corrente (o quella appena creata)
    displayChat(currentChatId);
});
</script>

</body>
</html>
