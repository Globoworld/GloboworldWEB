    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-light: #252526;
            --sidebar-bg: #2d2d30;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --user-bubble: #007acc;
            --bot-bubble: #3c3c3c;
            --border-color: #3f3f46;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Stile generale e reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body, .container {
            height: 100%;
            overflow: hidden; /* Previene lo scroll della pagina intera */
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--text-color);
        }

        .container {
            display: flex;
        }

        /* -----------------------
           ASIDE (Sidebar)
        ----------------------- */
        .chat__menu {
            width: 250px;
            background-color: var(--sidebar-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s ease-in-out;
            position: relative;
            z-index: 10;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            max-width: 100%;
            height: auto;
            border-radius: 8px; /* Aggiunto per uniformità */
        }

        #new-chat-btn, #delete-chat-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        #new-chat-btn {
            background-color: var(--accent-color);
            color: white;
        }

        #new-chat-btn:hover {
            background-color: #005f99;
        }

        #delete-chat-btn {
            background-color: #cc4444;
            color: white;
        }

        #delete-chat-btn:hover {
            background-color: #a33232;
        }

        #chat-list {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-light);
            color: var(--text-color);
            margin-top: 10px;
            cursor: pointer;
            flex-grow: 0;
            /* Non occupa spazio in eccesso */
        }
        
        /* Stile chat-item */
        .chat-item {
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 4px;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: background-color 0.2s;
        }
        
        .chat-item.active {
            background-color: #005f99;
        }
        
        .chat-item:not(.active):hover {
            background-color: #3c3c3c;
        }

        /* Stile mobile: la sidebar è nascosta di default */
        @media (max-width: 768px) {
            .chat__menu {
                position: absolute;
                height: 100%;
                left: 0;
                top: 0;
                transform: translateX(-100%);
            }
            .chat__menu.open {
                transform: translateX(0);
            }
        }

        /* -----------------------
           BODY (Chat principale)
        ----------------------- */
        .chat__body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-light);
            overflow: hidden; /* Gestito dallo scrollbar di chat-box */
        }

        /* HEADER */
        .chat__header {
            padding: 15px 20px;
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat__header h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 2px;
        }

        .chat__header p {
            font-size: 0.8rem;
            color: #888;
        }

        .menu-toggle {
            display: none; /* Nascosto su desktop */
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.8rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block; /* Visibile su mobile */
            }
        }

        /* MAIN (Area Messaggi) */
        .chat__main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px; /* Spazio per lo scrollbar */
            margin-bottom: 15px;
            display: flex;
            flex-direction: column; /* Necessario per allineare le bolle con flex-end/start */
        }

        /* Stile delle bolle di messaggio */
        .message {
            max-width: 75%;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 20px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative; /* Per il pulsante copia */
        }
        
        .typing-indicator {
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 20px;
            background-color: var(--bot-bubble);
            color: var(--text-color);
            align-self: flex-start;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        .user {
            background-color: var(--user-bubble);
            color: white;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .bot {
            background-color: var(--bot-bubble);
            color: var(--text-color);
            align-self: flex-start;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }
        
        /* 💡 Stili per link e tabelle dentro i messaggi */
        .message a {
            color: #55b4ff;
            text-decoration: underline;
        }
        
        .message table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            background-color: var(--bg-dark);
        }
        
        .message th, .message td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }
        
        .message th {
            background-color: var(--sidebar-bg);
        }

        .bot.error {
            background-color: #ff5555;
            color: white;
        }
        
        /* 💡 Stili per i blocchi di codice */
        .code-block-wrapper {
            position: relative;
            margin: 10px 0;
        }

        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a1a1a;
            padding: 5px 10px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-size: 0.8rem;
            color: #aaa;
        }

        .copy-code-btn {
            background: #4a4a4a;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .copy-code-btn:hover {
            background: #5a5a5a;
        }
        
        .copy-code-btn:active {
            background: #007acc;
        }

        .message pre {
            margin: 0 !important; /* Resetta il margine per allinearsi con l'header */
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        /* FOOTER (Area Input) */
        .chat__footer {
            display: flex;
            align-items: flex-end; /* Allinea gli elementi in basso */
            border-top: 1px solid var(--border-color);
            padding: 15px 0 0 0;
        }

        .chat__textarea {
            flex-grow: 1;
            max-height: 200px; /* Limite massimo per l'espansione */
            min-height: 50px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            margin-right: 10px;
            resize: none;
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-size: 1rem;
            line-height: 1.2;
            overflow-y: auto; /* Permette lo scroll quando il testo aumenta */
            transition: height 0.2s;
        }

        .chat__textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        /* FIX/MIGLIORAMENTO: Stile circolare per il pulsante Invia */
        .chat-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }

        .chat-submit:hover {
            background-color: #005f99;
        }
        
        /* Pulsante per il file */
        #file-input {
            display: none; /* Nascondi l'input field */
        }
        
        .send-file {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--accent-color);
            font-size: 1.5rem; /* Dimensione dell'icona */
            padding: 5px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            height: 50px; /* Allineato con la textarea */
        }

        .send-file:hover {
            color: #005f99;
        }
        
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const chatBox = document.getElementById('chat-box');
            const menuToggle = document.getElementById('menu-toggle');
            const menu = document.getElementById('menu');
            const newChatBtn = document.getElementById('new-chat-btn');
            const deleteChatBtn = document.getElementById('delete-chat-btn');
            const chatListContainer = document.getElementById('chat-list');
            const fileInput = document.getElementById('file-input');
            
            let currentChatId = null;
            let chats = {};

            // 💡 FIX: Aggiunto un debounce per il ridimensionamento della textarea
            function adjustTextareaHeight() {
                userInput.style.height = 'auto';
                userInput.style.height = userInput.scrollHeight + 'px';
            }

            // 💡 FIX: Aggiunta logica per abilitare/disabilitare il pulsante invia
            function toggleSendButton() {
                const isInputEmpty = userInput.value.trim() === '';
                const hasFile = fileInput.files.length > 0;
                sendBtn.disabled = !(!isInputEmpty || hasFile);
            }
            
            userInput.addEventListener('input', () => {
                adjustTextareaHeight();
                toggleSendButton();
            });
            
            fileInput.addEventListener('change', toggleSendButton);

            // 🔹 Funzioni di supporto
            function generateUniqueId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
            }

            function loadChats() {
                const storedChats = localStorage.getItem('globoAI_chats');
                if (storedChats) {
                    chats = JSON.parse(storedChats);
                } else {
                    chats = {};
                }
                renderChatList();
            }

            function saveChats() {
                localStorage.setItem('globoAI_chats', JSON.stringify(chats));
            }

            function loadChatMessages(id) {
                return chats[id] ? chats[id].messages : [];
            }
            
            // 💡 FIX: Funzione per gestire la copia del codice
            function copyCode(button) {
                const pre = button.closest('.code-block-wrapper').querySelector('pre');
                const code = pre.textContent;
                navigator.clipboard.writeText(code).then(() => {
                    const originalText = button.textContent;
                    button.textContent = 'Copiato!';
                    setTimeout(() => {
                        button.textContent = originalText;
                    }, 2000);
                }).catch(err => {
                    console.error('Errore nella copia:', err);
                });
            }

            function createMessageNode(content, type, isError = false) {
                const messageNode = document.createElement('div');
                messageNode.classList.add('message', type);
                if (isError) {
                    messageNode.classList.add('error');
                }

                if (type === 'bot') {
                    // Converti Markdown in HTML
                    const rawHtml = marked.parse(content);
                    // Sanitizza l'HTML per prevenire attacchi XSS
                    const safeHtml = DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } });
                    messageNode.innerHTML = safeHtml;

                    // Gestione di Highlighting e pulsante di copia
                    messageNode.querySelectorAll('pre code').forEach((block) => {
                        // Applicare l'highlighting
                        hljs.highlightElement(block);
                        
                        // Creare il wrapper per il blocco di codice
                        const wrapper = document.createElement('div');
                        wrapper.classList.add('code-block-wrapper');

                        // Creare l'header con il pulsante copia
                        const header = document.createElement('div');
                        header.classList.add('code-block-header');
                        
                        // Determina la lingua
                        const language = block.className.match(/language-(\w+)/)?.[1] || 'plaintext';
                        
                        const langSpan = document.createElement('span');
                        langSpan.textContent = language.toUpperCase();
                        
                        const copyBtn = document.createElement('button');
                        copyBtn.classList.add('copy-code-btn');
                        copyBtn.textContent = 'Copia Codice';
                        
                        // 💡 FIX: Aggiunto l'event listener al pulsante di copia
                        copyBtn.addEventListener('click', () => copyCode(copyBtn));
                        
                        header.appendChild(langSpan);
                        header.appendChild(copyBtn);

                        // Riassemblare
                        block.parentNode.replaceChild(wrapper, block.parentNode);
                        wrapper.appendChild(header);
                        wrapper.appendChild(block.parentNode);
                    });

                } else {
                    // Messaggi utente: solo testo semplice
                    messageNode.textContent = content;
                }

                return messageNode;
            }

            function addTypingIndicator() {
                const indicator = document.createElement('div');
                indicator.classList.add('typing-indicator');
                indicator.id = 'typing-indicator';
                indicator.textContent = 'GloboAI sta scrivendo...';
                chatBox.appendChild(indicator);
                chatBox.scrollTop = chatBox.scrollHeight;
                return indicator;
            }

            function removeTypingIndicator(indicator) {
                if (indicator && indicator.parentNode) {
                    indicator.parentNode.removeChild(indicator);
                }
            }
            
            // 💡 FIX: Implementazione semplificata per la gestione degli errori API/Network
            function showApiError(error) {
                const errorMessage = `**Errore di connessione o API:** ${error.message || "Qualcosa è andato storto."}\n\nRiprova o inizia una nuova chat.`;
                const errorNode = createMessageNode(errorMessage, 'bot', true);
                chatBox.appendChild(errorNode);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function createNewChat() {
                const id = generateUniqueId();
                const now = new Date();
                chats[id] = {
                    title: `Nuova Chat ${Object.keys(chats).length + 1}`,
                    messages: [],
                    timestamp: now.toISOString()
                };
                saveChats();
                renderChatList();
                localStorage.setItem('currentChatId', id);
                return id;
            }

            function deleteChat(id) {
                if (chats[id]) {
                    delete chats[id];
                    saveChats();
                    
                    // Se la chat eliminata era quella corrente, passa alla più recente o creane una nuova
                    const chatIds = Object.keys(chats).sort((a, b) => new Date(chats[b].timestamp) - new Date(chats[a].timestamp));
                    if (chatIds.length > 0) {
                        currentChatId = chatIds[0];
                        localStorage.setItem('currentChatId', currentChatId);
                    } else {
                        currentChatId = createNewChat();
                    }
                    displayChat(currentChatId);
                }
            }

            function renderChatList() {
                chatListContainer.innerHTML = '';
                const chatIds = Object.keys(chats).sort((a, b) => new Date(chats[b].timestamp) - new Date(chats[a].timestamp));
                
                chatIds.forEach(id => {
                    const chat = chats[id];
                    const chatItem = document.createElement('div');
                    chatItem.classList.add('chat-item');
                    chatItem.dataset.chatId = id;
                    chatItem.textContent = chat.title;
                    
                    if (id === currentChatId) {
                        chatItem.classList.add('active');
                    }
                    
                    chatItem.addEventListener('click', () => {
                        if (currentChatId !== id) {
                            currentChatId = id;
                            localStorage.setItem('currentChatId', id);
                            displayChat(id);
                            // Chiudi la sidebar su mobile dopo la selezione
                            if (window.innerWidth <= 768) {
                                menu.classList.remove('open');
                            }
                        }
                    });
                    chatListContainer.appendChild(chatItem);
                });
            }

            function displayChat(id) {
                chatBox.innerHTML = '';
                const messages = loadChatMessages(id);
                messages.forEach(msg => {
                    chatBox.appendChild(createMessageNode(msg.content, msg.type));
                });
                chatBox.scrollTop = chatBox.scrollHeight;
                
                // Aggiorna la lista per l'elemento attivo
                document.querySelectorAll('.chat-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.dataset.chatId === id) {
                        item.classList.add('active');
                    }
                });
            }

            async function sendMessage() {
                const userText = userInput.value.trim();
                const file = fileInput.files[0];

                if (!userText && !file) {
                    return;
                }

                // 1. Aggiungi il messaggio utente alla chat
                const messageContent = file ? `${userText}\n\n[File: ${file.name}]` : userText;
                const userMessageNode = createMessageNode(messageContent, 'user');
                chatBox.appendChild(userMessageNode);
                
                // Aggiorna la chat in memoria e l'header se è il primo messaggio
                if (chats[currentChatId].messages.length === 0) {
                    chats[currentChatId].title = userText.substring(0, 30) + (userText.length > 30 ? '...' : '');
                    renderChatList();
                }
                chats[currentChatId].messages.push({ type: 'user', content: userText });
                saveChats();

                // 2. Resetta l'input
                userInput.value = '';
                fileInput.value = ''; // Resetta il campo file
                adjustTextareaHeight();
                toggleSendButton(); // Disabilita di nuovo il pulsante

                // 3. Mostra l'indicatore di scrittura
                const typingNode = addTypingIndicator();
                
                chatBox.scrollTop = chatBox.scrollHeight;

                try {
                    // 💡 FIX: Sostituzione della CHIAMATA API/MOCK con una risposta simulata
                    const mockApiResponse = {
                        response: "Ottima domanda! Ho analizzato il tuo input. Dato che mi hai chiesto di correggere il codice, ecco un esempio di un blocco di codice funzionante:\n\n```javascript\nfunction greet(name) {\n  // Questo è un esempio di codice Javascript\n  const message = `Hello, ${name}!`;\n  console.log(message);\n  return message;\n}\n\ngreet(\"Mondo\");\n```\n\nSpero sia d'aiuto! Se hai caricato un file, consideralo elaborato. Se mi fornisci il contenuto, posso analizzarlo meglio.",
                        status: 200
                    };

                    // Simula un ritardo di rete (es. 1.5 secondi)
                    await new Promise(resolve => setTimeout(resolve, 1500));

                    if (mockApiResponse.status === 200) {
                        const botContent = mockApiResponse.response;
                        
                        // 4. Rimuovi l'indicatore di scrittura
                        removeTypingIndicator(typingNode);
                        
                        // 5. Aggiungi la risposta del bot
                        const botMessageNode = createMessageNode(botContent, 'bot');
                        chatBox.appendChild(botMessageNode);

                        // 6. Aggiorna la chat in memoria
                        chats[currentChatId].messages.push({ type: 'bot', content: botContent });
                        saveChats();
                    } else {
                        // Gestione di un errore di risposta simulato
                        removeTypingIndicator(typingNode);
                        throw new Error(`Risposta del server non riuscita (Status: ${mockApiResponse.status})`);
                    }

                } catch (err) {
                    console.error("Errore fatale API/Network:", err);
                    removeTypingIndicator(typingNode);
                    showApiError(err);
                }
                
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // 🔹 Eventi UI
            menuToggle.addEventListener('click', () => {
                menu.classList.toggle('open');
            });

            sendBtn.addEventListener('click', sendMessage);
            
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!sendBtn.disabled) { // Controlla se il pulsante è abilitato
                        sendMessage();
                    }
                }
            });

            newChatBtn.addEventListener('click', () => {
                const newId = createNewChat();
                displayChat(newId);
            });
            
            deleteChatBtn.addEventListener('click', () => {
                if (window.confirm("Sei sicuro di voler eliminare questa chat?")) {
                    deleteChat(currentChatId);
                }
            });

            // 🔹 Avvio
            loadChats();
            const storedChatId = localStorage.getItem('currentChatId');
            
            if (storedChatId && chats[storedChatId]) {
                currentChatId = storedChatId;
            } else {
                 // Trova l'ultima chat o creane una nuova
                const chatIds = Object.keys(chats).sort((a, b) => new Date(chats[b].timestamp) - new Date(chats[a].timestamp));
                if (chatIds.length > 0) {
                    currentChatId = chatIds[0];
                } else {
                    currentChatId = createNewChat();
                }
                localStorage.setItem('currentChatId', currentChatId);
            }
            
            displayChat(currentChatId);
            toggleSendButton(); // Inizializza lo stato del pulsante
            
            // Focus automatico sulla textarea
            userInput.focus();
        });
    </script>
</body>
</html>
