<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GloboAI</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>

    <link rel="icon" href="favicon.ico"> 

<style>
    :root {
        --bg-dark: #1e1e1e;
        --bg-light: #252526;
        --sidebar-bg: #2d2d30;
        --text-color: #d4d4d4;
        --accent-color: #007acc;
        --user-bubble: #007acc;
        --bot-bubble: #3c3c3c;
        --border-color: #3f3f46;
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ************************************** */
    /* CORREZIONE 1: BASE FONT-SIZE PER REM */
    /* Imposta 1rem = 10px per calcoli più facili e coerenza */
    /* ************************************** */
    html {
        font-size: 62.5%; /* 10px / 16px = 0.625 */
    }

    /* Stile generale e reset */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body, .container {
        height: 100%;
        overflow: hidden;
        font-family: var(--font-family);
        background-color: var(--bg-dark);
        color: var(--text-color);
        font-size: 1.6rem; /* Il font base è ora 16px */
    }

    .container {
        display: flex;
        flex-wrap: nowrap;
    }

    /* ASIDE (Sidebar) */
    .chat__menu {
        width: 100%;
        max-width: 25rem; /* 250px */
        background-color: var(--sidebar-bg);
        padding: 1.5rem; /* 15px */
        display: flex;
        flex-direction: column;
        border-right: 0.1rem solid var(--border-color);
        transition: transform 0.3s ease-in-out;
        z-index: 10;
    }

    .logo {
        text-align: center;
        margin-bottom: 2rem;
    }

    .logo img {
        max-width: 100%;
        height: auto;
        border-radius: 0.8rem;
    }

    #new-chat-btn, #delete-chat-btn {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 0.5rem;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: bold;
        font-size: 1.4rem; /* 14px */
        transition: background-color 0.2s;
    }

    #new-chat-btn {
        background-color: var(--accent-color);
        color: white;
    }

    #new-chat-btn:hover {
        background-color: #005f99;
    }

    #delete-chat-btn {
        background-color: #cc4444;
        color: white;
    }

    #delete-chat-btn:hover {
        background-color: #a33232;
    }

    #chat-list {
        width: 100%;
        padding: 0.8rem;
        border-radius: 0.5rem;
        border: 0.1rem solid var(--border-color);
        background-color: var(--bg-dark);
        color: var(--text-color);
        margin-top: 0.5rem;
        cursor: pointer;
        flex-grow: 0;
        font-size: 1.4rem; /* 14px */
    }

    @media (max-width: 768px) {
        .chat__menu {
            position: absolute;
            height: 100%;
            left: 0;
            top: 0;
            transform: translateX(-100%);
        }
        .chat__menu.open {
            transform: translateX(0);
        }
    }

    /* BODY (Chat principale) */
    .chat__body {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-light);
        overflow: hidden;
    }

    /* HEADER */
    .chat__header {
        padding: 1rem 1.25rem;
        background-color: var(--sidebar-bg);
        border-bottom: 0.1rem solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat__header h1 {
        font-size: 2.2rem; /* 22px */
        color: var(--accent-color);
        margin-bottom: 0.25rem;
    }

    .chat__header p {
        font-size: 1.2rem; /* 12px */
        color: #888;
    }

    .menu-toggle {
        display: none;
        background: none;
        border: none;
        color: var(--text-color);
        font-size: 2rem; /* 20px */
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .menu-toggle {
            display: block;
        }
    }

    /* MAIN (Area Messaggi) */
    .chat__main {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
        overflow: hidden;
        height: 100%;
    }

    #chat-box {
        flex-grow: 1;
        overflow-y: auto;
        padding-right: 1.5rem;
        margin-bottom: 1.5rem;
    }

    /* Stile delle bolle di messaggio */
    .message {
        max-width: 75%;
        padding: 1.2rem 1.5rem;
        margin-bottom: 1rem;
        border-radius: 2rem;
        line-height: 1.5;
        word-wrap: break-word;
        font-size: 1.6rem; /* 16px */
    }

    .user {
        background-color: var(--user-bubble);
        color: white;
        align-self: flex-end;
        margin-left: auto;
        border-bottom-right-radius: 0.5rem;
    }

    .bot {
        background-color: var(--bot-bubble);
        color: var(--text-color);
        align-self: flex-start;
        margin-right: auto;
        border-bottom-left-radius: 0.5rem;
    }

    /* Stili per link e tabelle */
    .message a {
        color: #55b4ff;
        text-decoration: underline;
    }

    .message table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        background-color: var(--bg-dark);
        font-size: 1.4rem;
    }

    .message th, .message td {
        border: 0.1rem solid var(--border-color);
        padding: 0.8rem;
        text-align: left;
    }

    .message th {
        background-color: var(--sidebar-bg);
    }

    .bot.error {
        background-color: #ff5555;
        color: white;
    }

    /* Stili per i blocchi di codice */
    .code-block-wrapper {
        position: relative;
        margin: 1rem 0;
    }

    .code-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #1a1a1a;
        padding: 0.5rem 1rem;
        border-top-left-radius: 0.8rem;
        border-top-right-radius: 0.8rem;
        font-size: 1.2rem; /* 12px */
        color: #aaa;
    }

    .copy-code-btn {
        background: #4a4a4a;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
        font-size: 1.2rem;
    }

    .copy-code-btn:hover {
        background: #5a5a5a;
    }

    .message pre {
        margin: 0 !important;
        border-top-left-radius: 0;
        border-top-right-radius: 0;
    }

    /* ************************************** */
    /* CORREZIONE 2: ALLINEAMENTO FOOTER */
    /* Standardizza le dimensioni per l'allineamento */
    /* ************************************** */
    .chat__foter {
        display: flex;
        align-items: flex-end; /* Allinea gli elementi in basso (textarea può crescere) */
        border-top: 0.1rem solid var(--border-color);
        padding: 1.5rem;
    }

    .chat__textarea {
        flex-grow: 1;
        /* Rimuoviamo height: 3rem per lasciare che padding e resize gestiscano l'altezza */
        min-height: 4.8rem; /* Altezza minima (circa 2 linee di testo) */
        max-height: 15rem; /* Altezza massima per evitare che prenda tutto lo schermo */
        padding: 1.1rem 1.6rem; 
        border: 0.1rem solid var(--border-color);
        border-radius: 2.5rem; /* 25px */
        margin-right: 1rem;
        resize: vertical; /* Permetti solo il resize verticale */
        background-color: var(--bg-dark);
        color: var(--text-color);
        font-size: 1.6rem; /* 16px */
        line-height: 1.3;
        overflow-y: auto;
        transition: border-color 0.2s;
    }

    .chat__textarea:focus {
        outline: none;
        border-color: var(--accent-color);
    }

    .chat-submit {
        height: 4.8rem; /* Altezza fissa per un cerchio perfetto allineato al textarea */
        width: 4.8rem; /* Larghezza fissa */
        padding: 0; /* Il padding viene gestito dall'altezza/larghezza fissa */
        border: none;
        border-radius: 50%;
        background-color: var(--accent-color);
        color: white;
        cursor: pointer;
        transition: background-color 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0; /* Impedisce che si rimpicciolisca */
        font-size: 2rem; /* Dimensione icona */
    }

    .chat-submit:hover {
        background-color: #005f99;
    }

    /* Pulsante per il file */
    #file-input {
        display: none;
    }
    
    .send-file {
        /* Dimensioni del pulsante per il file per allinearsi al submit */
        height: 4.8rem; 
        width: 4.8rem;
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--accent-color);
        font-size: 2.4rem; /* Dimensione icona più grande */
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        margin-right: 1rem;
    }

    .send-file:hover {
        color: #005f99;
    }

    /* Responsività generale */
    @media (max-width: 768px) {
        .chat__body {
            flex-direction: column;
        }
        .chat__footer {
            justify-content: space-between;
        }
    }
</style>
</head>
<body>

    <div class="container">
        <aside class="chat__menu" id="menu">
            <div class="logo">
                <img src="logo-placeholder.png" alt="GloboAI Logo"> 
            </div>
            <button id="new-chat-btn"><i class="fas fa-plus-circle"></i> Nuova Chat</button>
            <button id="delete-chat-btn"><i class="fas fa-trash-alt"></i> Elimina Chat</button>
            <select id="chat-list" aria-label="Seleziona chat precedente">
                <option value="default">Chat precedenti...</option>
            </select>
        </aside>

        <main class="chat__body">
            <header class="chat__header">
                <div>
                    <h1>GloboAI</h1>
                    <p>La tua intelligenza artificiale per l'analisi del codice.</p>
                </div>
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
            </header>

            <section class="chat__main">
                <div id="chat-box">
                    </div>
                
                <footer class="chat__footer">
                    <input type="file" id="file-input" accept=".txt, .js, .css, .html, .py, .java, .c, .cpp, .php">
                    <label for="file-input" class="send-file" title="Allega File">
                        <i class="fas fa-paperclip"></i>
                    </label>
                    <textarea id="user-input" class="chat__textarea" placeholder="Scrivi il tuo messaggio o incolla il codice qui..." rows="1"></textarea>
                    <button id="send-btn" class="chat-submit" title="Invia Messaggio">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </footer>
            </section>
        </main>
    </div>

    <script>
        // Inizializzazione di Highlight.js
        hljs.highlightAll();

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const newChatBtn = document.getElementById('new-chat-btn');
        const deleteChatBtn = document.getElementById('delete-chat-btn');
        const chatList = document.getElementById('chat-list');
        const menuToggle = document.getElementById('menu-toggle');
        const menu = document.getElementById('menu');
        const fileInput = document.getElementById('file-input');
        
        // Struttura fittizia per le chat salvate nel localStorage
        let chats = JSON.parse(localStorage.getItem('chats')) || {};
        let currentChatId = localStorage.getItem('currentChatId') || 'default';

        // Funzioni di utilità

        function sanitizeAndMarkdown(text) {
            // Converte il Markdown in HTML
            const html = marked.parse(text);
            // Pulisce l'HTML per prevenire XSS
            return DOMPurify.sanitize(html);
        }

        function createMessageElement(text, sender) {
            const messageWrapper = document.createElement('div');
            messageWrapper.classList.add('message-wrapper');
            
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender);
            
            // Gestione dei blocchi di codice per l'evidenziazione
            const sanitizedHtml = sanitizeAndMarkdown(text);
            
            // Funzione per avvolgere i blocchi di codice con l'header
            const wrapCodeBlocks = (html) => {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;

                tempDiv.querySelectorAll('pre code').forEach(codeBlock => {
                    const pre = codeBlock.parentNode;
                    
                    // Controlla se il blocco è già stato avvolto
                    if (pre.parentNode.classList.contains('code-block-wrapper')) {
                        return;
                    }
                    
                    // Identifica il linguaggio (se disponibile)
                    const languageClass = Array.from(codeBlock.classList).find(cls => cls.startsWith('language-'));
                    const language = languageClass ? languageClass.replace('language-', '') : 'plaintext';

                    // Crea l'header
                    const header = document.createElement('div');
                    header.classList.add('code-block-header');
                    header.innerHTML = `<span>${language.toUpperCase()}</span><button class="copy-code-btn">Copia Codice</button>`;
                    
                    // Crea il wrapper
                    const wrapper = document.createElement('div');
                    wrapper.classList.add('code-block-wrapper');
                    
                    // Assembla
                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(header);
                    wrapper.appendChild(pre);

                    // Aggiunge la funzionalità di copia
                    header.querySelector('.copy-code-btn').addEventListener('click', () => {
                        const code = codeBlock.innerText;
                        navigator.clipboard.writeText(code).then(() => {
                            header.querySelector('.copy-code-btn').innerText = 'Copiato!';
                            setTimeout(() => {
                                header.querySelector('.copy-code-btn').innerText = 'Copia Codice';
                            }, 2000);
                        });
                    });
                });
                return tempDiv.innerHTML;
            };

            messageElement.innerHTML = wrapCodeBlocks(sanitizedHtml);
            
            // Applica l'evidenziazione sintattica
            messageElement.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            messageWrapper.appendChild(messageElement);
            return messageWrapper;
        }

        function appendMessage(text, sender) {
            const messageElement = createMessageElement(text, sender);
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // Salva il messaggio nella chat corrente
            if (chats[currentChatId]) {
                chats[currentChatId].messages.push({ text, sender });
                saveChats();
            }
        }
        
        function getChatTitle(firstMessage) {
            // Prende le prime 5 parole e aggiunge '...'
            return firstMessage.split(/\s+/).slice(0, 5).join(' ') + '...';
        }

        function saveChats() {
            localStorage.setItem('chats', JSON.stringify(chats));
            populateChatList();
        }

        function createNewChat() {
            const newId = Date.now().toString();
            chats[newId] = {
                id: newId,
                title: 'Nuova Chat',
                messages: []
            };
            localStorage.setItem('currentChatId', newId);
            return newId;
        }

        function loadChat(chatId) {
            const chat = chats[chatId];
            if (chat) {
                chatBox.innerHTML = '';
                chat.messages.forEach(msg => {
                    appendMessage(msg.text, msg.sender);
                });
                // Ricarica la chat list per aggiornare la selezione
                populateChatList(chatId);
            }
        }

        function populateChatList(selectedId = currentChatId) {
            chatList.innerHTML = '<option value="default">Chat precedenti...</option>';
            
            // Ordina le chat dalla più recente alla meno recente
            const sortedChats = Object.values(chats).sort((a, b) => b.id - a.id);

            sortedChats.forEach(chat => {
                const option = document.createElement('option');
                option.value = chat.id;
                option.textContent = chat.title;
                if (chat.id === selectedId) {
                    option.selected = true;
                }
                chatList.appendChild(option);
            });
        }
        
        function simulateBotResponse(userMessage, isFile) {
            let botText = "Ciao! Sono GloboAI. Incolla qui il tuo codice o scrivi la tua domanda. Analizzo il codice e suggerisco miglioramenti per lo stile, le performance e la pulizia.";
            
            if (isFile) {
                const fileName = fileInput.files[0].name;
                botText = `Ho ricevuto il file **\`${fileName}\`**. La funzione di analisi avanzata dei file è in fase di sviluppo, ma puoi incollare il codice direttamente nella casella di testo per una risposta immediata!`;
            } else if (userMessage.length > 50) {
                 botText = "Grazie per il codice! Ho notato che l'uso di **`rem`** senza un **`font-size`** di base nell'HTML può causare problemi di ridimensionamento. Ti suggerisco di aggiungere: \n\n\`\`\`css\nhtml {\n  font-size: 62.5%; /* 1rem = 10px */\n}\n\`\`\`\n\nInoltre, ho corretto l'allineamento dei pulsanti nel footer per garantire coerenza con il campo di testo. Fammi sapere se desideri ulteriori analisi!";
            } else if (userMessage.includes('dimensione') || userMessage.includes('strane')) {
                botText = "Capisco che le dimensioni appaiano 'strane'. Ho corretto il problema nel CSS: la chiave era impostare **`html { font-size: 62.5%; }`** per stabilizzare le unità **`rem`** e allineare meglio il pulsante di invio nel `footer`. Prova il codice corretto che ti ho fornito!";
            }
            
            appendMessage(botText, 'bot');
        }

        function sendMessage() {
            let message = userInput.value.trim();
            const hasFile = fileInput.files.length > 0;
            
            if (!message && !hasFile) return;

            // Se è la prima domanda della chat, crea un titolo
            if (chats[currentChatId].messages.length === 0) {
                chats[currentChatId].title = getChatTitle(message || "File caricato");
            }
            
            // Se c'è un file, usa quello come parte del messaggio
            if (hasFile) {
                const fileName = fileInput.files[0].name;
                message = `[File Caricato: ${fileName}] ${message}`;
                appendMessage(message, 'user');
                simulateBotResponse(message, true);
                
                // Resetta il campo file
                fileInput.value = ''; 

            } else {
                appendMessage(message, 'user');
                simulateBotResponse(message, false);
            }

            userInput.value = '';
            // Forza l'altezza minima dopo l'invio
            userInput.style.height = userInput.style.minHeight; 
            
            saveChats();
        }

        // Event Listeners
        
        // Auto-ridimensionamento del textarea
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto'; // Resetta l'altezza per ricalcolarla
            userInput.style.height = userInput.scrollHeight + 'px'; // Imposta la nuova altezza
        });

        // Gestione cambio chat
        chatList.addEventListener('change', (e) => {
            const newChatId = e.target.value;
            if (newChatId !== 'default' && newChatId !== currentChatId) {
                currentChatId = newChatId;
                localStorage.setItem('currentChatId', currentChatId);
                loadChat(currentChatId);
            }
        });

        // Gestione file: usa la label per aprire l'input
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                // Triggera l'invio che gestirà la logica del file (il messaggio "in fase di sviluppo")
                sendMessage();
            }
        });


        menuToggle.addEventListener('click', () => {
            menu.classList.toggle('open');
        });

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        newChatBtn.addEventListener('click', () => {
            currentChatId = createNewChat();
            loadChat(currentChatId);
        });

        deleteChatBtn.addEventListener('click', () => {
            if (currentChatId && currentChatId !== 'default' && chats[currentChatId]) {
                const title = chats[currentChatId].title;
                if (confirm(`Sei sicuro di voler eliminare la chat "${title}"?`)) {
                    delete chats[currentChatId];
                    const chatKeys = Object.keys(chats);
                    
                    if (chatKeys.length > 0) {
                        // Carica la chat più recente rimasta
                        const latestChatId = chatKeys.sort((a, b) => b - a)[0];
                        currentChatId = latestChatId;
                        localStorage.setItem('currentChatId', currentChatId);
                        loadChat(currentChatId);
                    } else {
                        // Non ci sono più chat, crea una nuova chat di default
                        currentChatId = createNewChat();
                        loadChat(currentChatId);
                    }
                    saveChats();
                }
            } else {
                alert('Non c\'è nessuna chat da eliminare.');
            }
        });

        // Caricamento iniziale
        if (!chats[currentChatId]) {
            currentChatId = createNewChat();
        }
        loadChat(currentChatId);

    </script>
</body>
</html>
