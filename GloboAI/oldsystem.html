<head>

<style>
    :root {
        --bg-dark: #1e1e1e;
        --bg-light: #252526;
        --sidebar-bg: #2d2d30;
        --text-color: #d4d4d4;
        --accent-color: #007acc;
        --user-bubble: #007acc;
        --bot-bubble: #3c3c3c;
        --border-color: #3f3f46;
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Stile generale e reset */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body, .container {
        height: 100%;
        overflow: hidden; /* Previene lo scroll della pagina intera */
        font-family: var(--font-family);
        background-color: var(--bg-dark);
        color: var(--text-color);
    }

    .container {
        display: flex;
    }

    /* -----------------------
       ASIDE (Sidebar)
    ----------------------- */
    .chat__menu {
        width: 250px;
        background-color: var(--sidebar-bg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border-color);
        transition: transform 0.3s ease-in-out;
        position: relative;
        z-index: 10;
    }

    .logo {
        text-align: center;
        margin-bottom: 30px;
    }

    .logo img {
        max-width: 100%;
        height: auto;
        border-radius: 8px; /* Uniformità */
    }

    #new-chat-btn, #delete-chat-btn {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
    }

    #new-chat-btn {
        background-color: var(--accent-color);
        color: white;
    }

    #new-chat-btn:hover {
        background-color: #005f99;
    }

    #delete-chat-btn {
        background-color: #cc4444;
        color: white;
    }

    #delete-chat-btn:hover {
        background-color: #a33232;
    }

    #chat-list {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid var(--border-color);
        background-color: var(--bg-light);
        color: var(--text-color);
        margin-top: 10px;
        cursor: pointer;
        flex-grow: 1; /* Permette alla lista di occupare lo spazio disponibile */
        overflow-y: auto; 
        min-height: 50px; 
    }
    
    .chat-item {
        padding: 8px;
        margin-bottom: 5px;
        border-radius: 4px;
        cursor: pointer;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        transition: background-color 0.2s;
    }
    
    .chat-item.active {
        background-color: #005f99;
    }
    
    .chat-item:not(.active):hover {
        background-color: #3c3c3c;
    }

    /* Stile mobile: la sidebar è nascosta di default */
    @media (max-width: 768px) {
        .chat__menu {
            position: absolute;
            height: 100%;
            left: 0;
            top: 0;
            transform: translateX(-100%);
        }
        .chat__menu.open {
            transform: translateX(0);
        }
    }

    /* -----------------------
       BODY (Chat principale)
    ----------------------- */
    .chat__body {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-light);
        overflow: hidden;
    }

    /* HEADER */
    .chat__header {
        padding: 15px 20px;
        background-color: var(--sidebar-bg);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat__header h1 {
        font-size: 1.5rem;
        color: var(--accent-color);
        margin-bottom: 2px;
    }

    .chat__header p {
        font-size: 0.8rem;
        color: #888;
    }

    .menu-toggle {
        display: none; /* Nascosto su desktop */
        background: none;
        border: none;
        color: var(--text-color);
        font-size: 1.8rem;
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .menu-toggle {
            display: block; /* Visibile su mobile */
        }
    }

    /* MAIN (Area Messaggi) */
    .chat__main {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        padding: 20px;
        overflow: hidden;
    }

    #chat-box {
        flex-grow: 1;
        overflow-y: auto;
        padding-right: 10px; /* Spazio per lo scrollbar */
        margin-bottom: 15px;
        display: flex;
        flex-direction: column; 
    }
    
    /* FIX/MIGLIORAMENTO: Stile scrollbar su chat-box (Webkit) */
    #chat-box::-webkit-scrollbar {
        width: 8px;
    }

    #chat-box::-webkit-scrollbar-thumb {
        background-color: var(--border-color);
        border-radius: 4px;
    }

    /* Stile delle bolle di messaggio */
    .message {
        max-width: 75%;
        padding: 10px 15px;
        margin-bottom: 15px;
        border-radius: 20px;
        line-height: 1.5;
        word-wrap: break-word;
        position: relative; 
    }
    
    .typing-indicator {
        padding: 10px 15px;
        margin-bottom: 15px;
        border-radius: 20px;
        background-color: var(--bot-bubble);
        color: var(--text-color);
        align-self: flex-start;
        margin-right: auto;
        border-bottom-left-radius: 5px;
    }

    .user {
        background-color: var(--user-bubble);
        color: white;
        align-self: flex-end;
        margin-left: auto;
        border-bottom-right-radius: 5px;
    }

    .bot {
        background-color: var(--bot-bubble);
        color: var(--text-color);
        align-self: flex-start;
        margin-right: auto;
        border-bottom-left-radius: 5px;
    }
    
    /* Stili aggiuntivi per i messaggi del bot */
    .message a {
        color: #55b4ff;
        text-decoration: underline;
    }
    
    .message table {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0;
        background-color: var(--bg-dark);
    }
    
    .message th, .message td {
        border: 1px solid var(--border-color);
        padding: 8px;
        text-align: left;
    }
    
    .message th {
        background-color: var(--sidebar-bg);
    }

    .bot.error {
        background-color: #ff5555;
        color: white;
    }
    
    /* Stili per i blocchi di codice */
    .code-block-wrapper {
        position: relative;
        margin: 10px 0;
    }

    .code-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #1a1a1a;
        padding: 5px 10px;
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
        font-size: 0.8rem;
        color: #aaa;
    }

    .copy-code-btn {
        background: #4a4a4a;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.8rem;
    }
    .copy-code-btn:hover {
        background: #5a5a5a;
    }
    
    .copy-code-btn:active {
        background: #007acc;
    }

    .code-block-wrapper pre {
        margin: 0 !important; 
        border-top-left-radius: 0;
        border-top-right-radius: 0;
    }

    /* FOOTER (Area Input) */
    .chat__footer {
        display: flex;
        align-items: flex-end; 
        border-top: 1px solid var(--border-color);
        padding: 15px 20px 15px 20px; /* Aggiunto padding inferiore */
    }

    .chat__textarea {
        flex-grow: 1;
        max-height: 200px;
        min-height: 50px;
        padding: 15px;
        border: 1px solid var(--border-color);
        border-radius: 25px;
        margin-right: 10px;
        resize: none;
        background-color: var(--bg-dark);
        color: var(--text-color);
        font-size: 1rem;
        line-height: 1.2;
        overflow-y: auto; 
        transition: height 0.2s;
    }
    
    /* FIX: Nasconde la scrollbar della textarea (estetica) */
    .chat__textarea::-webkit-scrollbar {
        display: none;
    }
    .chat__textarea {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }

    .chat__textarea:focus {
        outline: none;
        border-color: var(--accent-color);
    }
    
    /* Pulsante Invia */
    .chat-submit {
        background-color: var(--accent-color);
        color: white;
        border: none;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        cursor: pointer;
        transition: background-color 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.2rem;
    }
    
    .chat-submit:disabled {
        background-color: #3f3f46;
        color: #888;
        cursor: not-allowed;
    }

    .chat-submit:hover:not(:disabled) {
        background-color: #005f99;
    }
    
    /* Pulsante per il file (Clip) */
    #file-input {
        display: none;
    }
    
    .send-file {
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--accent-color);
        font-size: 1.5rem; 
        padding: 5px;
        margin-right: 10px;
        display: flex;
        align-items: center;
        height: 50px; 
    }

    .send-file:hover {
        color: #005f99;
    }
    
</style>

            </div>

            <button id="new-chat-btn">Nuova Chat</button>
            <button id="delete-chat-btn">Elimina Chat Corrente</button>
            
            <div id="chat-list">
                </div>
            
        </aside>

        <div class="chat__body">
            
            <header class="chat__header">
                <div>
                    <h1>GloboAI</h1>
                    <p>Il tuo assistente personale per la programmazione e altro.</p>
                </div>
                <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
            </header>

            <main class="chat__main">
                <div id="chat-box">
                    <div class="bot message">
                        Ciao! Sono GloboAI. Inizia la conversazione scrivendo un messaggio qui sotto.
                    </div>
                </div>
                
                <footer class="chat__footer">
                    <label for="file-input" class="send-file">
                        <i class="fas fa-paperclip"></i>
                    </label>
                    <input type="file" id="file-input" accept=".txt,.pdf,.jpg,.png" />

                    <textarea id="user-input" class="chat__textarea" placeholder="Scrivi il tuo messaggio..."></textarea>
                    
                    <button id="send-btn" class="chat-submit" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </footer>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const chatBox = document.getElementById('chat-box');
            const menuToggle = document.getElementById('menu-toggle');
            const menu = document.getElementById('menu');
            const newChatBtn = document.getElementById('new-chat-btn');
            const deleteChatBtn = document.getElementById('delete-chat-btn');
            const chatListContainer = document.getElementById('chat-list');
            const fileInput = document.getElementById('file-input');
            
            let currentChatId = null;
            let chats = {};

            // 💡 FIX: Funzioni per gestione UI Input
            function adjustTextareaHeight() {
                userInput.style.height = 'auto';
                userInput.style.height = userInput.scrollHeight + 'px';
            }

            function toggleSendButton() {
                const isInputEmpty = userInput.value.trim() === '';
                const hasFile = fileInput.files.length > 0;
                // Abilita solo se c'è testo O un file
                sendBtn.disabled = !(!isInputEmpty || hasFile);
            }
            
            userInput.addEventListener('input', () => {
                adjustTextareaHeight();
                toggleSendButton();
            });
            
            fileInput.addEventListener('change', () => {
                toggleSendButton();
                // Mostra un feedback visivo se un file è stato selezionato
                const icon = document.querySelector('.send-file i');
                if (fileInput.files.length > 0) {
                    icon.style.color = 'green';
                } else {
                    icon.style.color = 'var(--accent-color)';
                }
            });

            // 🔹 Funzioni di supporto per la Chat State
            function generateUniqueId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
            }

            function loadChats() {
                const storedChats = localStorage.getItem('globoAI_chats');
                if (storedChats) {
                    chats = JSON.parse(storedChats);
                } else {
                    chats = {};
                }
                renderChatList();
            }

            function saveChats() {
                localStorage.setItem('globoAI_chats', JSON.stringify(chats));
            }

            function loadChatMessages(id) {
                return chats[id] ? chats[id].messages : [];
            }
            
            // 💡 FIX: Funzione per gestire la copia del codice
            function copyCode(button) {
                const pre = button.closest('.code-block-wrapper').querySelector('pre code');
                const code = pre.textContent;
                navigator.clipboard.writeText(code).then(() => {
                    const originalText = button.textContent;
                    button.textContent = 'Copiato!';
                    setTimeout(() => {
                        button.textContent = originalText;
                    }, 2000);
                }).catch(err => {
                    console.error('Errore nella copia:', err);
                });
            }

            function createMessageNode(content, type, isError = false) {
                const messageNode = document.createElement('div');
                messageNode.classList.add('message', type);
                if (isError) {
                    messageNode.classList.add('error');
                }

                if (type === 'bot') {
                    // Converti Markdown in HTML
                    // 💡 FIX: Aggiunta opzione di break line per marked
                    marked.setOptions({ breaks: true });
                    const rawHtml = marked.parse(content);
                    
                    // Sanitizza l'HTML
                    const safeHtml = DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } });
                    messageNode.innerHTML = safeHtml;

                    // Gestione di Highlighting e pulsante di copia
                    messageNode.querySelectorAll('pre code').forEach((block) => {
                        // Applicare l'highlighting
                        hljs.highlightElement(block);
                        
                        // Creare il wrapper per il blocco di codice
                        const wrapper = document.createElement('div');
                        wrapper.classList.add('code-block-wrapper');

                        // Creare l'header con il pulsante copia
                        const header = document.createElement('div');
                        header.classList.add('code-block-header');
                        
                        // Determina la lingua
                        const language = block.className.match(/language-(\w+)/)?.[1] || 'plaintext';
                        
                        const langSpan = document.createElement('span');
                        langSpan.textContent = language.toUpperCase();
                        
                        const copyBtn = document.createElement('button');
                        copyBtn.classList.add('copy-code-btn');
                        copyBtn.textContent = 'Copia Codice';
                        
                        // Aggiunto l'event listener al pulsante di copia
                        copyBtn.addEventListener('click', () => copyCode(copyBtn));
                        
                        header.appendChild(langSpan);
                        header.appendChild(copyBtn);

                        // Riassemblare l'elemento
                        const preElement = block.parentNode;
                        preElement.parentNode.replaceChild(wrapper, preElement);
                        wrapper.appendChild(header);
                        wrapper.appendChild(preElement);
                    });

                } else {
                    // Messaggi utente: solo testo semplice
                    messageNode.textContent = content;
                }

                return messageNode;
            }

            function addTypingIndicator() {
                const indicator = document.createElement('div');
                indicator.classList.add('typing-indicator');
                indicator.id = 'typing-indicator';
                indicator.textContent = 'GloboAI sta scrivendo...';
                chatBox.appendChild(indicator);
                chatBox.scrollTop = chatBox.scrollHeight;
                return indicator;
            }

            function removeTypingIndicator(indicator) {
                if (indicator && indicator.parentNode) {
                    indicator.parentNode.removeChild(indicator);
                }
            }
            
            function showApiError(error) {
                const errorMessage = `**Errore di connessione o API:** ${error.message || "Qualcosa è andato storto."}\n\nRiprova o inizia una nuova chat.`;
                const errorNode = createMessageNode(errorMessage, 'bot', true);
                chatBox.appendChild(errorNode);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function createNewChat() {
                const id = generateUniqueId();
                const now = new Date();
                chats[id] = {
                    title: `Nuova Chat ${Object.keys(chats).length + 1}`,
                    messages: [],
                    timestamp: now.toISOString()
                };
                saveChats();
                currentChatId = id; // Imposta la nuova chat come corrente
                renderChatList();
                displayChat(id);
                localStorage.setItem('currentChatId', id);
                return id;
            }

            function deleteChat(id) {
                if (chats[id]) {
                    delete chats[id];
                    saveChats();
                    
                    // 💡 FIX: Gestione della selezione della nuova chat corrente
                    const chatIds = Object.keys(chats).sort((a, b) => new Date(chats[b].timestamp) - new Date(chats[a].timestamp));
                    if (chatIds.length > 0) {
                        currentChatId = chatIds[0];
                    } else {
                        // Se non ci sono più chat, ne crea una nuova
                        currentChatId = createNewChat();
                    }
                    localStorage.setItem('currentChatId', currentChatId);
                    renderChatList();
                    displayChat(currentChatId);
                }
            }

            // 💡 FIX: Corretta la logica per renderizzare gli elementi DIV della chat list
            function renderChatList() {
                chatListContainer.innerHTML = '';
                // Ordina per timestamp più recente
                const chatIds = Object.keys(chats).sort((a, b) => new Date(chats[b].timestamp) - new Date(chats[a].timestamp));
                
                chatIds.forEach(id => {
                    const chat = chats[id];
                    const chatItem = document.createElement('div');
                    chatItem.classList.add('chat-item');
                    chatItem.dataset.chatId = id;
                    chatItem.textContent = chat.title;
                    
                    if (id === currentChatId) {
                        chatItem.classList.add('active');
                    }
                    
                    chatItem.addEventListener('click', () => {
                        if (currentChatId !== id) {
                            currentChatId = id;
                            localStorage.setItem('currentChatId', id);
                            displayChat(id);
                            if (window.innerWidth <= 768) {
                                menu.classList.remove('open');
                            }
                        }
                    });
                    chatListContainer.appendChild(chatItem);
                });
            }

            function displayChat(id) {
                chatBox.innerHTML = '';
                const messages = loadChatMessages(id);
                
                // Se la chat è vuota, aggiungi il messaggio di benvenuto iniziale
                if (messages.length === 0) {
                    chatBox.appendChild(createMessageNode("Ciao! Sono GloboAI. Inizia la conversazione scrivendo un messaggio qui sotto.", 'bot'));
                } else {
                    messages.forEach(msg => {
                        chatBox.appendChild(createMessageNode(msg.content, msg.type));
                    });
                }
                
                chatBox.scrollTop = chatBox.scrollHeight;
                
                // Aggiorna l'highlight nella sidebar
                document.querySelectorAll('.chat-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.dataset.chatId === id) {
                        item.classList.add('active');
                    }
                });
            }

            async function sendMessage() {
                const userText = userInput.value.trim();
                const file = fileInput.files[0];

                if (!userText && !file) {
                    return;
                }

                // 1. Aggiungi il messaggio utente alla chat
                let messageContent = userText;
                if (file) {
                     messageContent = `${userText}\n\n[File: ${file.name} - ${Math.round(file.size / 1024)}KB]`;
                }

                const userMessageNode = createMessageNode(messageContent, 'user');
                chatBox.appendChild(userMessageNode);
                
                // Aggiorna la chat in memoria e il titolo
                if (chats[currentChatId].messages.length === 0) {
                    chats[currentChatId].title = userText.substring(0, 30) + (userText.length > 30 ? '...' : '');
                    renderChatList(); // Ricarica la lista per aggiornare il titolo
                }
                chats[currentChatId].messages.push({ type: 'user', content: messageContent });
                saveChats();

                // 2. Resetta l'input
                userInput.value = '';
                fileInput.value = ''; // Resetta il campo file
                document.querySelector('.send-file i').style.color = 'var(--accent-color)'; // Resetta l'icona
                adjustTextareaHeight();
                toggleSendButton(); 

                // 3. Mostra l'indicatore di scrittura
                const typingNode = addTypingIndicator();
                chatBox.scrollTop = chatBox.scrollHeight;

                try {
                    // 💡 FIX: Logica di Mock API più robusta
                    const isCodeQuestion = userText.toLowerCase().includes('codice') || userText.toLowerCase().includes('html') || userText.toLowerCase().includes('script');
                    
                    let botContent;
                    if (isCodeQuestion) {
                        botContent = `Certo, ecco un esempio di **codice** corretto, come richiesto:\n\n\`\`\`javascript\nfunction calculateArea(radius) {\n  // Formula per l'area di un cerchio\n  if (radius <= 0) {\n    return "Errore: il raggio deve essere positivo.";\n  }\n  return Math.PI * radius * radius;\n}\n\nconsole.log(calculateArea(5));\n\`\`\`\n\nFammi sapere se hai bisogno di altre correzioni o chiarimenti!`;
                    } else if (file) {
                        botContent = `Ho ricevuto il tuo messaggio e il file **${file.name}**. In un'applicazione reale, lo analizzerei. Al momento, la mia risposta mock è: Analisi del file completata con successo!`;
                    } else {
                        botContent = `Ho ricevuto il tuo messaggio: **${userText}**. Questa è una risposta di prova per dimostrare che lo script funziona correttamente. Se hai bisogno di aiuto, usa il Markdown o prova a chiedere un esempio di codice!`;
                    }


                    // Simula un ritardo di rete
                    await new Promise(resolve => setTimeout(resolve, 1500));

                    
                    // 4. Rimuovi l'indicatore di scrittura
                    removeTypingIndicator(typingNode);
                    
                    // 5. Aggiungi la risposta del bot
                    const botMessageNode = createMessageNode(botContent, 'bot');
                    chatBox.appendChild(botMessageNode);

                    // 6. Aggiorna la chat in memoria
                    chats[currentChatId].messages.push({ type: 'bot', content: botContent });
                    saveChats();

                } catch (err) {
                    console.error("Errore fatale API/Network:", err);
                    removeTypingIndicator(typingNode);
                    showApiError(err);
                }
                
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // 🔹 Eventi UI (FIXED)
            menuToggle.addEventListener('click', () => {
                menu.classList.toggle('open');
            });

            sendBtn.addEventListener('click', sendMessage);
            
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!sendBtn.disabled) { 
                        sendMessage();
                    }
                }
            });

            newChatBtn.addEventListener('click', createNewChat);
            
            deleteChatBtn.addEventListener('click', () => {
                if (Object.keys(chats).length > 0 && window.confirm("Sei sicuro di voler eliminare questa chat?")) {
                    deleteChat(currentChatId);
                } else if (Object.keys(chats).length === 0) {
                    alert("Non ci sono chat da eliminare!");
                }
            });

            // 🔹 Avvio
            loadChats();
            const storedChatId = localStorage.getItem('currentChatId');
            
            if (storedChatId && chats[storedChatId]) {
                currentChatId = storedChatId;
            } else {
                 // Trova l'ultima chat o creane una nuova
                const chatIds = Object.keys(chats).sort((a, b) => new Date(chats[b].timestamp) - new Date(chats[a].timestamp));
                if (chatIds.length > 0) {
                    currentChatId = chatIds[0];
                } else {
                    currentChatId = createNewChat();
                }
                localStorage.setItem('currentChatId', currentChatId);
            }
            
            displayChat(currentChatId);
            toggleSendButton(); // Inizializza lo stato del pulsante
            userInput.focus();
        });
    </script>
</body>
</html>
