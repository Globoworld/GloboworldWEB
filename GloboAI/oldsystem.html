  <title>GloboAI</title>

  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500|Open+Sans:400,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00faa9;
      --accent: #00d6e0;
      --bg-dark: #0d1117;
      --bg-sidebar: linear-gradient(180deg, #111827, #0d1117);
      --bg-input: #161b22;
      --msg-user: linear-gradient(135deg, #00faa9, #00d6e0);
      --msg-bot: #2d333b;
      --text-light: #c9d1d9;
      --text-dark: #0d1117;
    }

    body {
      font-family: "Open Sans", "Roboto", sans-serif;
      margin: 0;
      background: var(--bg-dark);
      display: flex;
      height: 100vh;
      overflow: hidden;
      color: var(--text-light);
    }

    .chat {
      display: flex;
      flex: 1;
      height: 100%;
      width: 100%;
      transition: margin-left 0.3s;
    }

    /* Sidebar */
    .chat-menu {
      width: 260px;
      background: var(--bg-sidebar);
      color: var(--text-light);
      padding: 18px;
      box-sizing: border-box;
      flex-shrink: 0;
      transition: transform 0.3s;
    }
    .chat-menu .logo {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }
    .chat-menu button,
    .chat-menu select {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #1f2937;
      color: var(--text-light);
      border: 0;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }
    .chat-menu button:hover {
      background: #374151;
    }

    /* Chat body */
    .chat__body {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg-dark);
    }
    .chat__header {
      padding: 16px;
      border-bottom: 1px solid #30363d;
      background: #161b22;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat__header h1 {
      margin: 0;
      font-size: 18px;
      color: var(--primary);
    }
    .chat__header p {
      margin: 0;
      font-size: 13px;
      color: #8b949e;
    }
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-light);
    }

    .chat__main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      overflow-y: auto;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--msg-user);
      color: var(--text-dark);
      font-weight: 500;
    }
    .message.bot {
      align-self: flex-start;
      background: var(--msg-bot);
      color: var(--text-light);
    }

    .chat__footer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 10px;
      border-top: 1px solid #30363d;
      background: #161b22;
    }
    .chat__textarea {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #30363d;
      font-size: 14px;
      overflow-y: auto;
      background: var(--bg-input);
      color: var(--text-light);
    }
    .chat-submit {
      background: var(--msg-user);
      border: 0;
      color: var(--text-dark);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .chat-submit:hover {
      opacity: 0.85;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .chat-menu {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
        z-index: 100;
      }
      .chat-menu.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: inline-block;
      }
    }
  </style>
</head>

      <button id="new-chat-btn">➕ Nuova chat</button>
      <button id="delete-chat-btn">🗑️ Elimina chat</button>
      <select id="chat-list">
        <option value="">Seleziona una chat</option>
      </select>

    <!-- Chat body -->
    <div class="chat__body">
      <header class="chat__header">
        <div>
          <h1>GloboAI</h1>
          <p>Assistente AI di Globoworld: Adatto anche per lo studio!</p>
        </div>
        <button class="menu-toggle" id="menu-toggle">☰</button>
      </header>

      <main class="chat__main">
        <div id="chat-box"></div>
        <div class="chat__footer">
          <textarea id="user-input" class="chat__textarea" placeholder="Scrivi un messaggio..."></textarea>
          <button id="send-btn" class="chat-submit">Invia</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    const API_URL = 'https://free.v36.cm/v1/chat/completions';
    const API_KEY = 'sk-uw0qBhVuhLAUFDbQBb955989A13c463cA765A26aE1035e41';

    document.addEventListener('DOMContentLoaded', () => {
      const chatBox = document.getElementById('chat-box');
      const userInput = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const newChatBtn = document.getElementById('new-chat-btn');
      const deleteChatBtn = document.getElementById('delete-chat-btn');
      const chatList = document.getElementById('chat-list');
      const menu = document.getElementById('menu');
      const menuToggle = document.getElementById('menu-toggle');

      // Toggle menu mobile
      menuToggle.addEventListener('click', () => {
        menu.classList.toggle('open');
      });

      loadChats();
      let currentChatId = localStorage.getItem('currentChatId');
      if (!currentChatId) currentChatId = createNewChat();
      displayChat(currentChatId);

      sendBtn.addEventListener('click', sendMessage);
      userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      newChatBtn.addEventListener('click', () => {
        currentChatId = createNewChat();
        location.reload(); // 🔄 ricarica dopo creazione
      });

      deleteChatBtn.addEventListener('click', () => {
        deleteChat(currentChatId);
        location.reload(); // 🔄 ricarica dopo eliminazione
      });

      chatList.addEventListener('change', (e) => {
        const id = e.target.value;
        if (id) {
          currentChatId = id;
          localStorage.setItem('currentChatId', id);
          displayChat(id);
        }
      });

      function loadChats() {
        const chats = JSON.parse(localStorage.getItem('chats')) || [];
        chatList.innerHTML = '<option value="">Seleziona una chat</option>';
        chats.forEach(chat => {
          const opt = document.createElement('option');
          opt.value = chat.id;
          opt.textContent = chat.title || "Nuova chat";
          chatList.appendChild(opt);
        });
        const cur = localStorage.getItem('currentChatId') || '';
        if (cur) chatList.value = cur;
      }

      function createNewChat() {
        const systemMessage = {
          role: "system",
          content: "Sei GloboAI, un Assistente AI creato da Globoworld. Il tuo compito è servire le richieste dell'utente in modo etico e responsabile, purché non siano illegali."
        };
        const chats = JSON.parse(localStorage.getItem('chats')) || [];
        const newChat = { id: Date.now().toString(), title: "Nuova chat", messages: [systemMessage] };
        chats.unshift(newChat);
        localStorage.setItem('chats', JSON.stringify(chats));
        localStorage.setItem('currentChatId', newChat.id);
        return newChat.id;
      }

      function updateChatTitle(chatId, newTitle) {
        const chats = JSON.parse(localStorage.getItem('chats')) || [];
        const chat = chats.find(c => c.id === chatId);
        if (chat) {
          chat.title = newTitle;
          localStorage.setItem('chats', JSON.stringify(chats));
          loadChats();
        }
      }

      function deleteChat(chatId) {
        let chats = JSON.parse(localStorage.getItem('chats')) || [];
        chats = chats.filter(c => c.id !== chatId);
        localStorage.setItem('chats', JSON.stringify(chats));
        if (chats.length) localStorage.setItem('currentChatId', chats[0].id);
        else localStorage.removeItem('currentChatId');
      }

      function loadChatMessages(chatId) {
        const chats = JSON.parse(localStorage.getItem('chats')) || [];
        const chat = chats.find(c => c.id === chatId);
        return chat ? chat.messages : [];
      }

      function saveMessage(chatId, message) {
        const chats = JSON.parse(localStorage.getItem('chats')) || [];
        const chat = chats.find(c => c.id === chatId);
        if (chat) {
          chat.messages.push(message);
          localStorage.setItem('chats', JSON.stringify(chats));
        }
      }

      function appendMessage(text, who) {
        const div = document.createElement('div');
        div.className = 'message ' + (who === 'user' ? 'user' : 'bot');
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
      }

      function displayChat(chatId) {
        chatBox.innerHTML = '';
        const msgs = loadChatMessages(chatId);
        msgs.forEach(m => {
          if (m.role !== 'system') { // non mostrare messaggio system
            appendMessage(m.content, m.role === 'user' ? 'user' : 'bot');
          }
        });
      }

      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        saveMessage(currentChatId, { role: 'user', content: text });
        userInput.value = '';

        const typingNode = appendMessage('Sto pensando...', 'bot');

        const requestBody = {
          model: 'gpt-4o-mini',
          messages: loadChatMessages(currentChatId)
        };

        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify(requestBody)
          });
          const data = await res.json();

          let botText = data.choices?.[0]?.message?.content || "Ricarica la pagina e riprova. Se il problema persiste contatta l'amministratore del sito.";
          if (typingNode && typingNode.parentNode) typingNode.parentNode.removeChild(typingNode);
          appendMessage(botText, 'bot');
          saveMessage(currentChatId, { role: 'assistant', content: botText });

          // Genera titolo automatico
          const chats = JSON.parse(localStorage.getItem('chats')) || [];
          const chat = chats.find(c => c.id === currentChatId);
          if (chat && chat.title === "Nuova chat") {
            try {
              const titleReq = {
                model: 'gpt-4o-mini',
                messages: [
                  { role: "system", content: "Genera un titolo breve (massimo 3 parole) per questa chat." },
                  ...chat.messages.filter(m => m.role !== 'system')
                ]
              };
              const titleRes = await fetch(API_URL, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify(titleReq)
              });
              const titleData = await titleRes.json();
              const newTitle = titleData.choices?.[0]?.message?.content?.trim() || "Nuova chat";
              updateChatTitle(currentChatId, newTitle);
            } catch (titleErr) {
              console.error("Errore generazione titolo:", titleErr);
            }
          }
        } catch (err) {
          console.error(err);
          if (typingNode && typingNode.parentNode) typingNode.parentNode.removeChild(typingNode);
          appendMessage('Errore: impossibile contattare il server.', 'bot');
        }
      }
    });
  </script>
