<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globocook Search</title>

    <link rel="icon" type="image/png" href="https://globoworld.github.io/GloboworldWEB/Globosearch/logo.png">

    <style>
        :root {
            --bg-color: #1a1b1e;
            --container-bg: #2d3035;
            --input-bg: #3e4247;
            --text-color: #e0e0e0;
            --placeholder-color: #999;
            --button-bg: #1e88e5;
            --button-hover: #1565c0;
            --link-color: #90caf9;
            --link-hover: #64b5f6;
            --snippet-color: #b0b0b0;
            --border-radius: 25px;
            --box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .search-container {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        .search-container img {
            width: 250px;
            height: auto;
            margin-bottom: 30px;
            transition: transform 0.3s ease-in-out;
        }

        .search-container img:hover {
            transform: scale(1.05);
        }

        .search-input-group {
            display: flex;
            align-items: center;
            background-color: var(--container-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 5px;
            transition: box-shadow 0.3s ease;
        }

        .search-input-group:focus-within {
            box-shadow: 0 5px 25px rgba(30, 136, 229, 0.4);
        }

        .search-input-group input[type="text"] {
            flex-grow: 1;
            padding: 15px 20px;
            font-size: 1.1em;
            border: none;
            outline: none;
            background-color: transparent;
            color: var(--text-color);
            border-radius: var(--border-radius) 0 0 var(--border-radius);
        }

        .search-input-group input[type="text"]::placeholder {
            color: var(--placeholder-color);
        }

        .search-input-group button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: var(--border-radius);
            background-color: var(--button-bg);
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .search-input-group button:hover {
            background-color: var(--button-hover);
        }

        .search-input-group button:active {
            transform: scale(0.98);
        }

        #results {
            margin-top: 40px;
            text-align: left;
            width: 100%;
        }

        .result-item {
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .result-item:hover {
            transform: translateY(-5px);
        }

        .result-item a {
            font-size: 1.3em;
            color: var(--link-color);
            text-decoration: none;
            font-weight: 600;
        }

        .result-item a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        .result-item p {
            font-size: 1em;
            color: var(--snippet-color);
            margin-top: 10px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <img src="https://globoworld.github.io/GloboworldWEB/Globosearch/logo.png" alt="Globocook Logo" class="logo">
        <div class="search-input-group">
            <input type="text" id="searchQuery" placeholder="Cerca ricette, ingredienti..." autofocus>
            <button onclick="performSearch()">Cerca</button>

    </div>
