<head>
    <link rel="icon" type="image/png" href="https://globoworld.github.io/GloboworldWEB/logosus.png">
    <meta charset="UTF-8">

    <style>
        :root {
            /* Tema Chiaro */
            --bg-color: #eef2f3;
            --container-bg: white;
            --text-color: #333;
            --header-bg: #007bff;
            --title-color: #0056b3;
            --button-bg: #0155db;
            --button-hover-bg: #00008B;
            --footer-bg: #f8f9fa;
            --footer-border: #ccc;
            --footer-link-color: #646465;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            --close-btn-bg: rgba(255, 255, 255, 0.9);
            --close-btn-hover-bg: #ddd;
        }

        [data-theme="dark"] {
            /* Tema Scuro */
            --bg-color: #2c3e50; /* Blu scuro/petrolio */
            --container-bg: #34495e; /* Grigio-blu scuro */
            --text-color: #ecf0f1; /* Bianco sporco */
            --header-bg: #3498db; /* Blu acceso per l'intestazione */
            --title-color: #ecf0f1;
            --button-bg: #2980b9; /* Blu per i bottoni */
            --button-hover-bg: #3498db;
            --footer-bg: #2c3e50;
            --footer-border: #555;
            --footer-link-color: #bdc3c7;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            --close-btn-bg: rgba(44, 62, 80, 0.9);
            --close-btn-hover-bg: #4a627a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        header {
            background-color: var(--header-bg);
            padding: 10px 20px;
            text-align: right;
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        img.logo {
            max-width: 300px;
            height: auto;
            display: block;
            margin: 20px auto;
        }
        h2 {
            text-align: center;
            color: var(--title-color);
            margin: 20px 0;
            font-size: 2em;
            transition: color 0.3s;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: var(--container-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        /* Stili per la griglia di servizi */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); /* 3-4 colonne su desktop, si adatta su mobile */
            gap: 20px;
            padding: 20px 0;
            text-align: center;
        }
        .service-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background-color: var(--button-bg);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
            aspect-ratio: 1 / 1; /* Rende il bottone quadrato */
        }
        .service-button:hover {
            background-color: var(--button-hover-bg);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        .service-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        /* Footer come richiesto */
        footer {
            margin-top: 40px;
            padding: 15px 0;
            text-align: center;
            background-color: var(--footer-bg);
            border-top: 1px solid var(--footer-border);
            font-size: 14px;
            color: var(--text-color);
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, color 0.3s;
        }
        .footer-links {
            background-color: var(--footer-bg);
            padding: 20px;
            text-align: center;
            transition: background-color 0.3s;
        }
        .footer-links a {
            color: var(--footer-link-color);
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.3s;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        /* Toggler Tema */
        .theme-toggler {
            text-align: center;
            margin-bottom: 20px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            /* Icone all'interno dello switch */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #007bff;
            content: "\f185"; /* Icona Sole (Light Mode) */
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
        }
        input:checked + .slider {
            background-color: #2196F3;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
            background-color: #fdd835; /* Giallo per la luna */
            content: "\f186"; /* Icona Luna (Dark Mode) */
            color: #2c3e50;
        }

        /* Stile banner (mantenuto) */
        .banner-container {
            position: relative;
            display: block;
            margin: 0 auto 20px;
            max-width: 50%;
        }
        .banner {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 6px;
        }
        .close-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 22px;
            font-weight: bold;
            color: var(--text-color);
            background: var(--close-btn-bg);
            border-radius: 50%;
            padding: 4px 10px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background 0.3s, color 0.3s;
        }
        .close-btn:hover {
            background: var(--close-btn-hover-bg);
        }
        /* Media Query per layout responsivo */
        @media (max-width: 600px) {
            .services-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); /* 2 colonne su mobile */
                gap: 15px;
            }
            .service-icon {
                font-size: 2.5em;
            }
            .service-button {
                font-size: 12px;
                padding: 10px;
            }
            .banner-container {
                max-width: 80%;
            }
        }
    </style>
</head>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker
                .register("https://globoworld.github.io/GloboworldWEB/sw.js")
                .then(reg => console.log("✅ Service Worker registrato:", reg.scope))
                .catch(err => console.error("❌ SW registration failed:", err));
        });
    }

    // Funzione per gestire il Dark/Light Mode
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    }

    // Applica il tema al caricamento della pagina
    document.addEventListener('DOMContentLoaded', () => {
        const storedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', storedTheme);
        document.getElementById('theme-checkbox').checked = storedTheme === 'dark';
    });
</script>
